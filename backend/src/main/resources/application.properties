spring.application.name=renovation-backend
server.port=${PORT:8080}

# The local database was created separately in pgAdmin.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/csit314_db}
spring.datasource.username=${DB_USERNAME:csit314_app}
spring.datasource.password=${DB_PASSWORD}

# Never allow Hibernate to auto-create or silently alter application tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Apply versioned migrations before Hibernate validates the mapped tables.
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Reject unknown request properties (including client-submitted roles).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Stateful browser sessions for Story #18. Set SESSION_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Initial local administrator is explicitly opt-in. Disable after first successful creation.
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
# Optional one-time Platform Manager bootstrap in the local Spring profile only.
app.manager.bootstrap.enabled=${MANAGER_BOOTSTRAP_ENABLED:false}
