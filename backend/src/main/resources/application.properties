spring.application.name=renovation-backend
server.port=${PORT:8080}

# The local database was created separately in pgAdmin.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/csit314_db}
spring.datasource.username=${DB_USERNAME:csit314_app}
spring.datasource.password=${DB_PASSWORD}

# Never allow Hibernate to auto-create or silently alter application tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No application tables or migration scripts have been defined at scaffold time.
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
